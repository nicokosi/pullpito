[package]
name = "pullpito"
version = "0.1.1"
description = "Command-line for GitHub pull request statistics 🧪"
repository = "https://github.com/nicokosi/pullpito"
readme = "README.md"
keywords = ["github", "cli", "pull-request", "summary"]
categories = ["cli", "cli-tools"]
license = "MIT"
authors = ["Nicolas Kosinski <nicokosi@yahoo.com>"]
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["blocking"] }

[lib]
doctest = false
